name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seq2lead
          POSTGRES_USER: seq2lead
          POSTGRES_PASSWORD: seq2lead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seq2lead -d seq2lead"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SEQ2LEAD_DB_HOST: localhost
      # 5432 here, not the 5433 the README uses locally: the service container
      # above owns the runner's port map, so there is nothing to collide with.
      # Setting it explicitly also exercises the env-override path in DbConfig.
      SEQ2LEAD_DB_PORT: "5432"
      SEQ2LEAD_DB_NAME: seq2lead
      SEQ2LEAD_DB_USER: seq2lead
      SEQ2LEAD_DB_PASSWORD: seq2lead

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run seq2lead db migrate

      # ------------------------------------------------------------------
      # PORTABLE tests only, and the boundary is MEASURED from real runs of
      # this workflow rather than guessed.
      #
      # ONE cause now puts a test out of CI's reach:
      #
      #   ARTIFACT-DEPENDENT -- 16 files. A checkout excludes 1.83 GB of
      #   docking runs, M9 per-seed records, feature caches and the 433 MB
      #   training-membership export, and a CI database is migrated but empty.
      #   Reproduced locally against a separate empty database: 90 failures and
      #   34 errors, matching the real run.
      #
      # There used to be a second cause. tests/test_cli.py and
      # tests/test_safeguards.py each had one test that greps a flag name out of
      # CLI --help output, and Rich styles every switch, so on a runner with
      # colour the substring was never there. NO_COLOR cannot fix it because
      # FORCE_COLOR takes precedence, and at a narrow width Rich *truncates* the
      # switch ("--rel..."), so no text normalisation recovers it either. Both
      # tests now read the switch names and the documented guarantees from
      # Click's own parameter objects and render the CLI in a child process at a
      # width the test pins -- see tests/cli_help.py. Nothing was skipped or
      # weakened; both files run here, and were verified green under
      # FORCE_COLOR=1 at widths 80, 40 and 20.
      #
      # Nothing is weakened, skipped or deselected inside the test code. The 16
      # files are excluded HERE so the boundary is visible, and a green CI run is
      # not a claim that they passed -- they did not run.
      - name: Test (portable subset)
        run: >-
          uv run pytest -v
          --ignore=tests/test_dual_encoder.py
          --ignore=tests/test_eval_contracts.py
          --ignore=tests/test_eval_verification.py
          --ignore=tests/test_feature_contracts.py
          --ignore=tests/test_feature_identity.py
          --ignore=tests/test_m10_corrections.py
          --ignore=tests/test_m10_docking.py
          --ignore=tests/test_m10_hardening.py
          --ignore=tests/test_m11c_acquisition.py
          --ignore=tests/test_m11f_record.py
          --ignore=tests/test_m11g_contract.py
          --ignore=tests/test_m9_corrections.py
          --ignore=tests/test_m9_followup.py
          --ignore=tests/test_m9_wiring.py
          --ignore=tests/test_result_versions.py
          --ignore=tests/test_splits.py

      # The README offers this as the no-database workflow, so CI has to prove
      # it still works rather than leaving it to rot.
      - name: Test without a database (portable subset)
        run: >-
          uv run pytest
          --ignore=tests/test_dual_encoder.py
          --ignore=tests/test_eval_contracts.py
          --ignore=tests/test_eval_verification.py
          --ignore=tests/test_feature_contracts.py
          --ignore=tests/test_feature_identity.py
          --ignore=tests/test_m10_corrections.py
          --ignore=tests/test_m10_docking.py
          --ignore=tests/test_m10_hardening.py
          --ignore=tests/test_m11c_acquisition.py
          --ignore=tests/test_m11f_record.py
          --ignore=tests/test_m11g_contract.py
          --ignore=tests/test_m9_corrections.py
          --ignore=tests/test_m9_followup.py
          --ignore=tests/test_m9_wiring.py
          --ignore=tests/test_result_versions.py
          --ignore=tests/test_splits.py
        env:
          SEQ2LEAD_SKIP_DB_TESTS: "1"

      - name: State what CI did not cover
        if: always()
        run: |
          echo "CI ran the portable subset only. NOT run here:"
          echo "  artifact-dependent (16 files) -- need the local artifact set:"
          echo "    tests/test_dual_encoder.py"
          echo "    tests/test_eval_contracts.py"
          echo "    tests/test_eval_verification.py"
          echo "    tests/test_feature_contracts.py"
          echo "    tests/test_feature_identity.py"
          echo "    tests/test_m10_corrections.py"
          echo "    tests/test_m10_docking.py"
          echo "    tests/test_m10_hardening.py"
          echo "    tests/test_m11c_acquisition.py"
          echo "    tests/test_m11f_record.py"
          echo "    tests/test_m11g_contract.py"
          echo "    tests/test_m9_corrections.py"
          echo "    tests/test_m9_followup.py"
          echo "    tests/test_m9_wiring.py"
          echo "    tests/test_result_versions.py"
          echo "    tests/test_splits.py"
          echo "  environment-dependent: none. The two ANSI/help-output tests were"
          echo "  repaired and now run above; see tests/cli_help.py."
          echo "See docs/CI_SCOPE.md. Run the full suite on a complete local tree."

      - name: Smoke-check the CLI
        run: |
          uv run seq2lead version
          uv run seq2lead env check
          uv run seq2lead db ping
