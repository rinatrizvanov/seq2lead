[project]
name = "seq2lead"
version = "0.1.0"
description = "Sequence-to-lead ranking over a reproducible bioactivity database with a leakage-controlled benchmark."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "rdkit>=2024.3.1",
    "torch>=2.4",
    "transformers>=4.44",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "meeko>=0.8.0",
    "gemmi>=0.7.5",
]

[project.scripts]
seq2lead = "seq2lead.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seq2lead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_db: needs a reachable PostgreSQL (docker compose -f docker/compose.yml up -d)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Two directories are excluded from lint and formatting because their value is
# being byte-identical to something recorded elsewhere, not being tidy.
#
# `paper/` is documentation tooling supplied by the closeout pack: it regenerates
# the manuscript and figures, is imported by nothing under `src/`, and fits
# nothing. Excluding it keeps the artifact exactly as supplied, which is what its
# provenance record describes.
#
# `scripts/asof/` holds the execution scripts as they actually ran. Their SHA-256
# digests are recorded in `scripts/asof/README.md` and in
# `configs/manifests/m11h_fit.json`, and the whole point of keeping them is that
# those digests match. Reformatting would invalidate all thirteen and break the
# claim that the preserved code is the code that executed.
extend-exclude = ["paper", "scripts/asof"]

[tool.ruff.lint.per-file-ignores]
# `web/ui.py` is a single embedded HTML/CSS/JS document held in one string. Its
# lines are markup, not Python, and reflowing them to 100 columns would break
# the markup to satisfy a Python rule.
"src/seq2lead/web/ui.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# CI runs on Linux, where the default PyPI torch wheel drags in the CUDA stack.
# Pin Linux to the CPU wheel; macOS keeps the default wheel, which carries MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
